<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rental System Promo</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      width:100%;
      height:100vh;
      overflow:hidden;
      background:
        radial-gradient(circle at top left, #1e3a8a 0%, transparent 35%),
        radial-gradient(circle at bottom right, #059669 0%, transparent 35%),
        #050816;

      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Poppins',sans-serif;
      color:white;
    }

    .container{
      width:90%;
      max-width:1100px;
      text-align:center;
      position:relative;
    }

    .typing-box{
      min-height:220px;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .text{
      font-size:clamp(1.8rem,4vw,4rem);
      font-weight:700;
      line-height:1.4;
      letter-spacing:1px;
      opacity:0;
      transform:scale(.8);
      animation:zoomIn .8s forwards;
      text-shadow:
        0 0 15px rgba(255,255,255,.15),
        0 0 40px rgba(16,185,129,.2);
    }

    .cursor{
      display:inline-block;
      width:4px;
      height:1em;
      background:#10b981;
      margin-left:8px;
      animation:blink .6s infinite;
      vertical-align:middle;
      border-radius:10px;
    }

    .glow{
      position:absolute;
      width:350px;
      height:350px;
      background:#10b981;
      filter:blur(140px);
      opacity:.12;
      z-index:-1;
      animation:float 6s ease-in-out infinite;
    }

    .glow:nth-child(1){
      top:-120px;
      left:-120px;
    }

    .glow:nth-child(2){
      bottom:-120px;
      right:-120px;
      background:#2563eb;
      animation-delay:3s;
    }

    @keyframes blink{
      50%{
        opacity:0;
      }
    }

    @keyframes zoomIn{
      from{
        opacity:0;
        transform:scale(.7);
        filter:blur(10px);
      }

      to{
        opacity:1;
        transform:scale(1);
        filter:blur(0);
      }
    }

    @keyframes float{
      50%{
        transform:translateY(-25px) scale(1.05);
      }
    }

  </style>
</head>
<body>

  <div class="glow"></div>
  <div class="glow"></div>

  <div class="container">
    <div class="typing-box">
      <div class="text" id="text"></div>
      <span class="cursor"></span>
    </div>
  </div>

  <script>

    const texts = [

  "Bado unafuatilia kodi kwa vitabu na Excel?",

  "Malipo ya M-Pesa yanathibitishwa papo hapo ⚡",

  "Risiti za PDF zinatumwa moja kwa moja kwa email 📄",

  "Fuatilia madeni na salio kwa muda halisi.",

  "Simamia wapangaji na nyumba kutoka popote.",

  "Chat ya mpangaji na landlord ndani ya mfumo 💬",

  "Hakuna tena kupotea kwa rekodi za malipo.",

  "JWT authentication salama kulinda taarifa zako 🔒",

  "Mfumo wa kisasa kwa landlords na caretakers.",

  "Usimamizi wa nyumba unaanza hapa."
];
    const textElement = document.getElementById("text");

    let textIndex = 0;
    let charIndex = 0;
    let deleting = false;

    function typeEffect(){

      const currentText = texts[textIndex];

      if(!deleting){
        textElement.innerHTML = currentText.substring(0, charIndex);
        charIndex++;

        if(charIndex > currentText.length){
          deleting = true;

          setTimeout(typeEffect, 1800);
          return;
        }

      }else{

        textElement.innerHTML = currentText.substring(0, charIndex);
        charIndex--;

        if(charIndex < 0){
          deleting = false;
          textIndex = (textIndex + 1) % texts.length;

          textElement.style.animation = "none";
          void textElement.offsetWidth;
          textElement.style.animation = "zoomIn .8s forwards";
        }
      }

      const speed = deleting ? 35 : 70;

      setTimeout(typeEffect, speed);
    }

    typeEffect();

  </script>

</body>
</html>
